<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcPro | Safe Expression Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-wrapper">
        <!-- Calculator Container -->
        <section class="calculator" aria-label="Calculator">
            <header class="calc-header">
                <div class="brand">
                    <span class="dot"></span>
                    <h1>Calc<span>Pro</span></h1>
                </div>
                <div class="header-actions">
                    <button id="historyToggle" class="icon-btn" title="Toggle History" aria-label="Toggle History">🕒</button>
                    <button id="themeToggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">☀️</button>
                </div>
            </header>

            <!-- Dual-line Display (Previous Expression + Current Result) -->
            <div class="display-screen">
                <div id="expressionDisplay" class="expression-text" aria-live="polite"></div>
                <input type="text" id="display" value="0" readonly aria-label="Calculator Display">
            </div>

            <!-- Keypad using Data Attributes (No inline onclick) -->
            <div class="buttons" id="keypad">
                <button class="btn btn-danger" data-action="clear">AC</button>
                <button class="btn btn-func" data-action="backspace" aria-label="Backspace">⌫</button>
                <button class="btn btn-func" data-value="%">%</button>
                <button class="btn btn-op" data-value="/">÷</button>

                <button class="btn" data-value="7">7</button>
                <button class="btn" data-value="8">8</button>
                <button class="btn" data-value="9">9</button>
                <button class="btn btn-op" data-value="*">×</button>

                <button class="btn" data-value="4">4</button>
                <button class="btn" data-value="5">5</button>
                <button class="btn" data-value="6">6</button>
                <button class="btn btn-op" data-value="-">−</button>

                <button class="btn" data-value="1">1</button>
                <button class="btn" data-value="2">2</button>
                <button class="btn" data-value="3">3</button>
                <button class="btn btn-op" data-value="+">+</button>

                <button class="btn" data-action="negate">±</button>
                <button class="btn" data-value="0">0</button>
                <button class="btn" data-value=".">.</button>
                <button class="btn btn-equal" data-action="calculate">=</button>
            </div>
        </section>

        <!-- History Sidebar -->
        <aside class="history-panel" id="historyPanel">
            <div class="history-header">
                <h2>History</h2>
                <button id="clearHistory" class="clear-history-btn">Clear</button>
            </div>
            <ul id="historyList" class="history-list">
                <li class="empty-msg">No calculations yet</li>
            </ul>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
